name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Build all targets
        run: |
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/macos-aarch64/rbx-microprofiler
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile dist/macos-x86_64/rbx-microprofiler
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile dist/linux-x86_64/rbx-microprofiler
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile dist/windows-x86_64/rbx-microprofiler.exe

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist/macos-aarch64 && tar -czf ../../rbx-microprofiler-v${VERSION}-macos-aarch64.tar.gz rbx-microprofiler && cd ../..
          cd dist/macos-x86_64 && tar -czf ../../rbx-microprofiler-v${VERSION}-macos-x86_64.tar.gz rbx-microprofiler && cd ../..
          cd dist/linux-x86_64 && tar -czf ../../rbx-microprofiler-v${VERSION}-linux-x86_64.tar.gz rbx-microprofiler && cd ../..
          cd dist/windows-x86_64 && 7z a ../../rbx-microprofiler-v${VERSION}-windows-x86_64.zip rbx-microprofiler.exe && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            rbx-microprofiler-v${{ steps.version.outputs.version }}-macos-aarch64.tar.gz
            rbx-microprofiler-v${{ steps.version.outputs.version }}-macos-x86_64.tar.gz
            rbx-microprofiler-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            rbx-microprofiler-v${{ steps.version.outputs.version }}-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
