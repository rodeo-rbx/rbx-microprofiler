name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            cmd: bun build --compile src/index.ts --outfile rbx-microprofiler
            outfile: rbx-microprofiler
            archive: tar
          - name: macos-x86_64
            os: macos-latest
            cmd: bun build --compile --target=bun-darwin-x64 src/index.ts --outfile rbx-microprofiler
            outfile: rbx-microprofiler
            archive: tar
          - name: linux-x86_64
            os: ubuntu-latest
            cmd: bun build --compile src/index.ts --outfile rbx-microprofiler
            outfile: rbx-microprofiler
            archive: tar
          - name: windows-x86_64
            os: windows-latest
            cmd: bun build --compile src/index.ts --outfile rbx-microprofiler.exe
            outfile: rbx-microprofiler.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Build
        run: ${{ matrix.cmd }}

      - name: Package (tar)
        if: matrix.archive == 'tar'
        run: tar -czf rbx-microprofiler-v${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz ${{ matrix.outfile }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: 7z a rbx-microprofiler-v${{ steps.version.outputs.version }}-${{ matrix.name }}.zip ${{ matrix.outfile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rbx-microprofiler-v${{ steps.version.outputs.version }}-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/rbx-microprofiler-v${{ steps.version.outputs.version }}-macos-aarch64.tar.gz
            artifacts/rbx-microprofiler-v${{ steps.version.outputs.version }}-macos-x86_64.tar.gz
            artifacts/rbx-microprofiler-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            artifacts/rbx-microprofiler-v${{ steps.version.outputs.version }}-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
