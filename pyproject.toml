[project]
name = "rbx-microprofiler-extractor"
version = "0.1.0"
description = "Extract Roblox MicroProfiler dumps to Perfetto/Chrome Trace format"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "playwright>=1.40",
    "perfetto>=0.7",
    "pandas>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]
